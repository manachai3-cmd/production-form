<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกสถานะงาน</title>
<style>
  :root {
    --green:#1D9E75;--green-light:#E1F5EE;--green-dark:#085041;
    --amber:#EF9F27;--amber-light:#FAEEDA;--amber-dark:#633806;
    --red:#E24B4A;--red-light:#FCEBEB;--red-dark:#791F1F;
    --blue:#185FA5;--blue-light:#E6F1FB;--blue-dark:#0C447C;
    --border:#e0e0e0;--text:#1a1a1a;--muted:#666;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Sarabun',-apple-system,sans-serif;background:#f0f7f4;min-height:100vh;padding:1rem;color:var(--text);}
  .container{max-width:480px;margin:0 auto;}
  .header{text-align:center;padding:1.25rem 0 1rem;}
  .header h1{font-size:20px;font-weight:700;}
  .header p{font-size:13px;color:var(--muted);margin-top:4px;}
  .card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:1.25rem;margin-bottom:12px;}
  .card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
  label.fl{font-size:13px;color:var(--muted);display:block;margin-bottom:5px;}
  label.fl span{color:var(--red);}
  input[type=text],input[type=number],textarea,select{width:100%;font-size:15px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:inherit;transition:border-color .15s;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);}
  textarea{resize:vertical;min-height:68px;line-height:1.5;}
  textarea:disabled{background:#f5f5f5;color:#aaa;cursor:not-allowed;border-color:#e0e0e0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mt{margin-top:12px;}
  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .st:last-child:nth-child(odd){grid-column:1/-1;}
  .st{border:1.5px solid var(--border);border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);background:#fff;transition:all .15s;user-select:none;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .st .ico{font-size:26px;}
  .st:hover{border-color:#aaa;background:#f9f9f9;}
  .st.sg{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
  .st.sr{background:var(--red-light);border-color:var(--red);color:var(--red-dark);}
  .st.sa{background:var(--amber-light);border-color:var(--amber);color:var(--amber-dark);}
  .st.sb{background:var(--blue-light);border-color:var(--blue);color:var(--blue-dark);}
  .hidden{display:none;}
  .qty-row{display:flex;align-items:center;gap:10px;}
  .qty-row input{width:130px;text-align:center;font-size:20px;font-weight:700;padding:10px;}
  .qty-unit{font-size:15px;color:var(--muted);}
  .qty-hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .ts-badge{font-size:12px;color:var(--muted);background:#f5f5f5;border-radius:6px;padding:5px 10px;margin-bottom:14px;}
  .submit-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .err{background:var(--red-light);color:var(--red-dark);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:13px;margin-top:10px;display:none;}
  #success-view{display:none;}
  .ok-card{background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius);padding:2rem;text-align:center;margin-bottom:12px;}
  .ok-icon{font-size:48px;margin-bottom:10px;}
  .ok-title{font-size:18px;font-weight:700;color:var(--green-dark);margin-bottom:4px;}
  .ok-sub{font-size:13px;color:var(--green);}
  .receipt{background:#fff;border:1px solid #b2dfdb;border-radius:8px;padding:12px;margin-top:14px;text-align:left;}
  .rr{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--green-light);gap:8px;}
  .rr:last-child{border-bottom:none;}
  .rk{color:var(--green);flex-shrink:0;}
  .rv{color:var(--green-dark);font-weight:700;text-align:right;}
  .new-btn{width:100%;background:#fff;color:var(--blue);border:1.5px solid var(--blue);border-radius:var(--radius);padding:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📋 บันทึกสถานะงาน</h1>
    <p id="ts-hdr"></p>
  </div>

  <div id="form-view">
    <div class="card">
      <div class="card-title">👤 ข้อมูลพนักงาน</div>
      <div class="ts-badge" id="ts-badge">🕐 ...</div>
      <div class="row2">
        <div>
          <label class="fl">ชื่อพนักงาน <span>*</span></label>
          <select id="f-name">
            <option value="">-- กำลังโหลดรายชื่อ... --</option>
          </select>
        </div>
        <div>
          <label class="fl">หมายเลข Job Order</label>
          <input type="text" id="f-job" placeholder="เช่น WO-2245" oninput="toggleNote(this.value)">
        </div>
      </div>
      <div class="mt">
        <label class="fl">งานที่ไม่มีหมายเลข (ทำอะไร)</label>
        <textarea id="f-note" placeholder="เช่น เตรียมวัสดุ, ทำความสะอาดเครื่อง, รอคำสั่ง..."></textarea>
      </div>
    </div>

    <div class="card">
      <div class="card-title">📊 สถานะ <span style="color:var(--red)">*</span></div>
      <div class="status-grid">
        <div class="st" id="st-normal" onclick="pick('normal')"><span class="ico">🟢</span>เริ่ม</div>
        <div class="st" id="st-stop"   onclick="pick('stop')">  <span class="ico">🔄</span>หยุดเปลี่ยนงาน</div>
        <div class="st" id="st-done"   onclick="pick('done')">  <span class="ico">🏁</span>เสร็จสิ้น</div>
        <div class="st" id="st-end"    onclick="pick('end')">   <span class="ico">🌙</span>เลิกงาน</div>
        <div class="st" id="st-ot"     onclick="pick('ot')">    <span class="ico">⭐</span>โอที</div>
      </div>
    </div>

    <div class="card hidden" id="step-card">
      <div class="card-title">🔢 ขั้นตอน</div>
      <input type="text" id="f-step" placeholder="เช่น ตัด, เชื่อม, ประกอบ, ตรวจสอบ, บรรจุ...">
    </div>

    <div class="card hidden" id="qty-card">
      <div class="card-title">📦 ยอดที่ผลิตได้ <span style="color:var(--red)">*</span></div>
      <div class="qty-row">
        <input type="number" id="f-qty" min="0" placeholder="0">
        <span class="qty-unit">ชิ้น</span>
      </div>
      <div class="qty-hint" id="qty-hint"></div>
    </div>

    <button class="submit-btn" id="sub-btn" onclick="submitForm()">ส่งข้อมูล</button>
    <div class="err" id="err-msg"></div>
  </div>

  <div id="success-view">
    <div class="ok-card">
      <div class="ok-icon">✅</div>
      <div class="ok-title">บันทึกสำเร็จ!</div>
      <div class="ok-sub">ข้อมูลถูกส่งเข้า Google Sheet แล้ว</div>
      <div class="receipt" id="receipt"></div>
    </div>
    <button class="new-btn" onclick="resetForm()">+ บันทึกรายการใหม่</button>
  </div>
</div>

<script>
var SHEET_URL = "https://script.google.com/macros/s/AKfycbzXYoYAYN4-9-QMlZyKX8hQMHE-XD0dI5g1dS3664o5lbVbr7e-XxFZPe9lwkMjiatIaQ/exec";
var SL       = { normal:"เริ่ม", stop:"หยุดเปลี่ยนงาน", done:"เสร็จสิ้น", end:"เลิกงาน", ot:"โอที" };
var IDS      = ["normal","stop","done","end","ot"];
var NEED_QTY = ["stop","done","end","ot"];
var cur      = "";

function updateTime() {
  var s = new Date().toLocaleString("th-TH",{timeZone:"Asia/Bangkok",day:"2-digit",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  document.getElementById("ts-badge").textContent = "🕐 " + s;
  document.getElementById("ts-hdr").textContent = s;
}
updateTime();
setInterval(updateTime, 30000);

function show(id){ document.getElementById(id).classList.remove("hidden"); }
function hide(id){ document.getElementById(id).classList.add("hidden"); }

function pick(id) {
  // เช็คเวลาสำหรับโอที (19:00 - 23:59 เท่านั้น)
  if (id === "ot") {
    var now = new Date();
    var h = parseInt(now.toLocaleString("th-TH",{timeZone:"Asia/Bangkok",hour:"2-digit",hour12:false}));
    if (h < 19) {
      alert("⏰ ยังไม่ถึงเวลาโอที\nสามารถเลือกได้เฉพาะเวลา 19:00 - 23:59 น. เท่านั้น");
      return;
    }
  }
  document.getElementById("err-msg").style.display = "none";
  IDS.forEach(function(s){ document.getElementById("st-"+s).className = "st"; });
  cur = id;
  var cls = { normal:"sg", stop:"sa", done:"sg", end:"sr", ot:"sb" };
  document.getElementById("st-"+id).classList.add(cls[id]);
  hide("step-card"); hide("qty-card");
  document.getElementById("f-step").value = "";
  document.getElementById("f-qty").value  = "";
  show("step-card");
  if (NEED_QTY.indexOf(id) !== -1) {
    show("qty-card");
    var hints = { stop:"บันทึกยอดที่ผลิตได้ก่อนเปลี่ยนงาน", done:"บันทึกยอดรวมเมื่องานเสร็จสิ้น", end:"บันทึกยอดรวมตอนเลิกงาน", ot:"บันทึกยอดที่ผลิตได้ระหว่างโอที" };
    document.getElementById("qty-hint").textContent = hints[id] || "";
  }
}

function toggleNote(jobVal) {
  var note = document.getElementById("f-note");
  if (jobVal.trim() !== "") {
    note.value = ""; note.disabled = true;
    note.placeholder = "ไม่สามารถกรอกได้เมื่อมีหมายเลข Job Order";
  } else {
    note.disabled = false;
    note.placeholder = "เช่น เตรียมวัสดุ, ทำความสะอาดเครื่อง, รอคำสั่ง...";
  }
}

function submitForm() {
  var name = document.getElementById("f-name").value;
  var job  = document.getElementById("f-job").value.trim();
  var note = document.getElementById("f-note").value.trim();
  var step = document.getElementById("f-step").value.trim();
  var qty  = document.getElementById("f-qty").value.trim();

  if (!name)                                 { showErr("กรุณาเลือกชื่อพนักงาน"); return; }
  if (!cur)                                  { showErr("กรุณาเลือกสถานะ"); return; }
  if (NEED_QTY.indexOf(cur) !== -1 && !qty) { showErr("กรุณากรอกยอดที่ผลิตได้"); return; }

  document.getElementById("err-msg").style.display = "none";
  var btn = document.getElementById("sub-btn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> กำลังส่งข้อมูล...';

  var recType = { normal:"-", stop:"หยุดเปลี่ยนงาน", done:"ตอนเสร็จสิ้น", end:"ตอนเลิกงาน", ot:"โอที" };
  var qtyVal  = NEED_QTY.indexOf(cur) !== -1 ? qty : "-";
  var cbName  = "cb" + Date.now();

  var params = "name="        + encodeURIComponent(name)
             + "&jobOrder="   + encodeURIComponent(job  || "-")
             + "&note="       + encodeURIComponent(note || "-")
             + "&status="     + encodeURIComponent(SL[cur])
             + "&step="       + encodeURIComponent(step || "-")
             + "&recordType=" + encodeURIComponent(recType[cur])
             + "&qty="        + encodeURIComponent(qtyVal)
             + "&callback="   + cbName;

  var done = false;
  var timer = setTimeout(function(){
    done = true;
    showErr("หมดเวลา — ตรวจสอบการ Deploy Apps Script");
    resetBtn();
    delete window[cbName];
    var s = document.getElementById("jsonp-s");
    if (s) s.parentNode.removeChild(s);
  }, 10000);

  window[cbName] = function(data) {
    if (done) return;
    clearTimeout(timer);
    delete window[cbName];
    var s = document.getElementById("jsonp-s");
    if (s) s.parentNode.removeChild(s);
    if (data.result === "ok") {
      showSuccess(name, job||"-", note||"-", SL[cur], step||"-", recType[cur], qtyVal, data.timestamp);
    } else {
      showErr("เกิดข้อผิดพลาด: " + (data.message||""));
      resetBtn();
    }
  };

  var script = document.createElement("script");
  script.id  = "jsonp-s";
  script.src = SHEET_URL + "?" + params;
  document.body.appendChild(script);
}

function showSuccess(name, job, note, status, step, recType, qty, ts) {
  document.getElementById("form-view").style.display = "none";
  document.getElementById("success-view").style.display = "block";
  var rows = [
    ["ประทับเวลา", ts||"-"], ["ชื่อพนักงาน", name],
    ["Job Order", job], ["งานที่ทำ", note],
    ["สถานะ", status], ["ขั้นตอน", step]
  ];
  if (NEED_QTY.indexOf(cur) !== -1) {
    rows.push(["ประเภทบันทึก", recType]);
    rows.push(["ยอดผลิต", parseInt(qty).toLocaleString() + " ชิ้น"]);
  }
  document.getElementById("receipt").innerHTML = rows.map(function(r){
    return '<div class="rr"><span class="rk">'+r[0]+'</span><span class="rv">'+r[1]+'</span></div>';
  }).join("");
}

function resetForm() {
  document.getElementById("f-note").disabled = false;
  ["f-job","f-note","f-qty","f-step"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.getElementById("f-name").selectedIndex = 0;
  cur = "";
  IDS.forEach(function(s){ document.getElementById("st-"+s).className = "st"; });
  hide("step-card"); hide("qty-card");
  document.getElementById("err-msg").style.display = "none";
  document.getElementById("success-view").style.display = "none";
  document.getElementById("form-view").style.display = "block";
  resetBtn(); updateTime();
}

function showErr(msg) {
  var el = document.getElementById("err-msg");
  el.textContent = "⚠️ " + msg; el.style.display = "block";
  resetBtn();
}

function resetBtn() {
  var btn = document.getElementById("sub-btn");
  btn.disabled = false; btn.innerHTML = "ส่งข้อมูล";
}

function loadNames() {
  var sel = document.getElementById("f-name");
  var cbName = "cbNames" + Date.now();
  window[cbName] = function(data) {
    delete window[cbName];
    var s = document.getElementById("jsonp-names");
    if (s) s.parentNode.removeChild(s);
    sel.innerHTML = '<option value="">-- เลือกชื่อพนักงาน --</option>';
    if (data.names && data.names.length) {
      data.names.forEach(function(n) {
        var opt = document.createElement("option");
        opt.value = n; opt.textContent = n;
        sel.appendChild(opt);
      });
    } else {
      sel.innerHTML = '<option value="">-- ไม่พบรายชื่อ --</option>';
    }
  };
  setTimeout(function() {
    if (window[cbName]) {
      sel.innerHTML = '<option value="">-- โหลดไม่สำเร็จ ลองรีเฟรช --</option>';
      delete window[cbName];
    }
  }, 8000);
  var script = document.createElement("script");
  script.id = "jsonp-names";
  script.src = SHEET_URL + "?action=getNames&callback=" + cbName;
  document.head.appendChild(script);
}
loadNames();
</script>
</body>
</html>
